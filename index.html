<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER SPINNING WHEEL</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#25104a,#070711 65%);color:white;font-family:Arial;text-align:center;display:flex;justify-content:center}
.wrap{width:min(760px,100%);padding:22px 14px}h1{font-size:clamp(30px,8vw,60px);margin:8px 0;text-shadow:0 0 12px #b82cff,0 0 35px #ff27bd}.sub{color:#c9bddc;font-weight:bold}
.stage{position:relative;width:min(620px,94vw);aspect-ratio:1;margin:auto}.pointer{position:absolute;z-index:2;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:40px solid white;filter:drop-shadow(0 0 14px #ff28cf)}
canvas{width:100%;height:100%;filter:drop-shadow(0 0 25px #9d35ff)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#0a0814;border:5px solid white;box-shadow:0 0 25px #a832ff;font-size:12px;font-weight:900}
button{margin-top:20px;padding:16px 30px;border:0;border-radius:18px;color:white;background:linear-gradient(135deg,#7622ff,#ff1cae);font-size:20px;font-weight:900;box-shadow:0 0 25px #b42cff;cursor:pointer}button:disabled{opacity:.5}.result{margin:18px 0;font-size:25px;font-weight:900}.tags{color:#ddd}.note{font-size:13px;color:#9289a4}
</style></head><body><div class="wrap">
<h1>SUPER SPINNING WHEEL</h1><p class="sub">WHO'S THE WINNER? 😈</p>
<div class="stage"><div class="pointer"></div><canvas id="w" width="700" height="700"></canvas><div class="center">SPIN</div></div>
<button id="b">🎯 SPIN THE WHEEL</button><div id="r" class="result">Ready?</div>
<div class="tags">FAYIS • AFLAH • ADIL • SINAN</div><p class="note">Previous audio stops immediately. Winner audio starts automatically.</p>
</div>
<script>
const names=['FAYIS','AFLAH','ADIL','SINAN'], files=['audio/fayis.mp3','audio/aflah.mp3','audio/adil.mp3','audio/sinan.mp3'];
const A=files.map(x=>new Audio(x)), c=document.getElementById('w'),x=c.getContext('2d'),N=4,S=Math.PI*2/N;let rot=0,busy=false;
function draw(){x.clearRect(0,0,700,700);x.save();x.translate(350,350);x.rotate(rot);
for(let i=0;i<N;i++){let a=i*S-S/2,g=x.createLinearGradient(0,0,300,300);g.addColorStop(0,i%2?'#22d9ff':'#ff2db7');g.addColorStop(1,i%2?'#3150ff':'#6b1cff');x.beginPath();x.moveTo(0,0);x.arc(0,0,325,a,a+S);x.closePath();x.fillStyle=g;x.fill();x.lineWidth=8;x.strokeStyle='#090713';x.stroke();x.save();x.rotate(i*S);x.textAlign='center';x.font='900 46px Arial';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=10;x.fillText(names[i],205,0);x.restore()}x.restore()}draw();
function stop(){A.forEach(a=>{a.pause();a.currentTime=0})}
b.onclick=()=>{if(busy)return;busy=true;b.disabled=true;stop();r.textContent='SPINNING…';let win=Math.floor(Math.random()*N),start=rot,target=-win*S,delta=target-((rot%(2*Math.PI))+2*Math.PI)%(2*Math.PI);while(delta<0)delta+=2*Math.PI;let end=start+(7+Math.random()*2)*2*Math.PI+delta,t=performance.now(),dur=5200;
function f(q){let p=Math.min(1,(q-t)/dur),e=1-Math.pow(1-p,4);rot=start+(end-start)*e;draw();if(p<1)requestAnimationFrame(f);else{rot=end;draw();r.textContent='🎉 WINNER: '+names[win]+' 🎉';A[win].play().catch(()=>{});busy=false;b.disabled=false}}requestAnimationFrame(f)}
</script></body></html>
