<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER SPINNING WHEEL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#080812;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.container{
  text-align:center;
  width:100%;
  max-width:600px;
  padding:20px;
}

h1{
  font-size:clamp(28px,8vw,52px);
  margin-bottom:8px;
  color:#fff;
  text-shadow:
    0 0 10px #9d35ff,
    0 0 25px #9d35ff;
}

.subtitle{
  color:#aaa;
  margin-bottom:20px;
}

.wheel-box{
  position:relative;
  width:min(88vw,430px);
  height:min(88vw,430px);
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  border-radius:50%;
  filter:
    drop-shadow(0 0 12px #9d35ff)
    drop-shadow(0 0 30px #9d35ff);
}

.pointer{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:38px solid #fff;
  filter:drop-shadow(0 0 8px #fff);
  z-index:5;
}

button{
  margin-top:25px;
  padding:15px 42px;
  border:none;
  border-radius:50px;
  background:linear-gradient(90deg,#7b2cff,#d32cff);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:
    0 0 15px #9d35ff,
    0 0 35px #9d35ff;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#winner{
  min-height:45px;
  margin-top:22px;
  font-size:28px;
  font-weight:bold;
  color:#fff;
  text-shadow:0 0 15px #ff38ff;
}
</style>
</head>

<body>

<div class="container">

  <h1>SUPER SPINNING WHEEL</h1>
  <div class="subtitle">WHO WILL BE THE WINNER?</div>

  <div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <button id="spinBtn">🎡 SPIN</button>

  <div id="winner"></div>

</div>

<script>
const people = [
  {
    name: "FAYIS",
    audio: "./fayis.mp3"
  },
  {
    name: "AFLAH",
    audio: "./aflah.mp3"
  },
  {
    name: "ADIL",
    audio: "./adil.mp3"
  },
  {
    name: "SINAN",
    audio: "./sinan.mp3"
  }
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const winnerText = document.getElementById("winner");

const N = people.length;
const segment = (Math.PI * 2) / N;

let rotation = 0;
let spinning = false;
let currentAudio = null;

const audioByName = {};

people.forEach(person => {
  const audio = new Audio(person.audio);
  audio.preload = "auto";
  audioByName[person.name] = audio;
});

function drawWheel(){
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = canvas.width / 2 - 12;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<N;i++){

    const start = rotation + i * segment - segment/2;
    const end = start + segment;

    const colors = [
      "#ff1744",
      "#7c4dff",
      "#00e5ff",
      "#ffea00"
    ];

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.save();

    const middle = start + segment/2;

    ctx.translate(
      cx + Math.cos(middle) * radius * .62,
      cy + Math.sin(middle) * radius * .62
    );

    ctx.rotate(middle + Math.PI/2);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 42px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "#000";
    ctx.shadowBlur = 8;

    ctx.fillText(people[i].name,0,0);

    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx,cy,48,0,Math.PI*2);
  ctx.fillStyle="#111";
  ctx.fill();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=5;
  ctx.stroke();
}

draw
