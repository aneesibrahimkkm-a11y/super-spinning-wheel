<script>
const players = [
  { name: "FAYIS", audio: "fayis.mp3" },
  { name: "AFLAH", audio: "aflah.mp3" },
  { name: "ADIL", audio: "adil.mp3" },
  { name: "SINAN", audio: "sinan.mp3" }
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinButton = document.getElementById("spinButton");
const winnerText = document.getElementById("winner");

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const radius = 375;

const count = players.length;
const segment = Math.PI * 2 / count;

let rotation = 0;
let spinning = false;
let currentAudio = null;

const audioMap = {};

players.forEach(player => {
  const audio = new Audio(player.audio);
  audio.preload = "auto";
  audioMap[player.name] = audio;
});

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}

function playWinner(name) {
  stopAudio();

  currentAudio = audioMap[name];

  if (currentAudio) {
    currentAudio.currentTime = 0;
    currentAudio.play().catch(() => {});
  }
}

function drawWheel() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const colors = [
    "#ff1744",
    "#7c4dff",
    "#00d9ff",
    "#ffcc00"
  ];

  for (let i = 0; i < count; i++) {

    const start =
      rotation +
      i * segment -
      segment / 2;

    const end = start + segment;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(
      centerX,
      centerY,
      radius,
      start,
      end
    );
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 7;
    ctx.stroke();

    const angle = start + segment / 2;

    const textX =
      centerX +
      Math.cos(angle) * radius * 0.62;

    const textY =
      centerY +
      Math.sin(angle) * radius * 0.62;

    ctx.save();

    ctx.translate(textX, textY);
    ctx.rotate(angle + Math.PI / 2);

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 48px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "#000000";
    ctx.shadowBlur = 10;

    ctx.fillText(players[i].name, 0, 0);

    ctx.restore();
  }

  /* Center */

  ctx.beginPath();
  ctx.arc(
    centerX,
    centerY,
    55,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#090909";
  ctx.fill();

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 7;
  ctx.stroke();
}

drawWheel();


spinButton.addEventListener("click", () => {

  if (spinning) return;

  spinning = true;
  spinButton.disabled = true;

  winnerText.textContent = "";

  /* Previous audio stops immediately */
  stopAudio();

  /* Pick exactly one winner */
  const winnerIndex =
    Math.floor(Math.random() * count);

  const winner =
    players[winnerIndex];

  /*
    Pointer is at the top.
    Make the selected segment finish there.
  */

  const pointer = -Math.PI / 2;

  const wantedRotation =
    pointer -
    winnerIndex * segment;

  /*
    9 complete spins
    + exact final position
  */

  const fullSpins =
    Math.PI * 2 * 9;

  const startRotation = rotation;

  const finalRotation =
    startRotation +
    fullSpins +
    (wantedRotation - startRotation) % (Math.PI * 2);

  const total =
    finalRotation - startRotation;

  /*
    5.2 seconds
  */

  const duration = 5200;

  const startTime =
    performance.now();


  function spin(now) {

    const elapsed =
      now - startTime;

    const progress =
      Math.min(
        elapsed / duration,
        1
      );

    /*
      Fast start → smooth slow finish
    */

    const eased =
      1 -
      Math.pow(
        1 - progress,
        4
      );

    rotation =
      startRotation +
      total * eased;

    drawWheel();

    if (progress < 1) {

      requestAnimationFrame(spin);

    } else {

      rotation = finalRotation;

      drawWheel();

      winnerText.textContent =
        "🏆 WINNER: " + winner.name;

      /* Correct audio for exact winner */
      playWinner(winner.name);

      spinning = false;
      spinButton.disabled = false;
    }
  }

  requestAnimationFrame(spin);
});
        </script>
